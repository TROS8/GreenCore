name: GreenCore CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'
  JWT_SECRET_TEST: 'test-jwt-secret-for-junit-only'

jobs:

  # 1 - Generador de codigo desde modelo.json
  generate:
    name: Code Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-gen-${{ hashFiles('greencore-generator/requirements.txt') }}

      - name: Install generator deps
        run: pip install -r greencore-generator/requirements.txt

      - name: Run generator
        run: python greencore-generator/generate.py

      - name: Upload generated i18n
        uses: actions/upload-artifact@v6
        with:
          name: generated-i18n
          path: |
            backend/src/main/resources/messages.properties
            backend/src/main/resources/messages_en.properties

  # 2 - Backend Spring Boot + JUnit
  backend:
    name: Backend - Spring Boot + JUnit
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v5

      - name: Download generated i18n
        uses: actions/download-artifact@v6
        with:
          name: generated-i18n
          path: backend/src/main/resources/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Maven
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build and test
        working-directory: backend
        run: |
          mvn -B package \
            -Dapp.jwt.secret="${{ env.JWT_SECRET_TEST }}" \
            -Dspring.security.oauth2.client.registration.google.client-id=test-ci \
            -Dspring.security.oauth2.client.registration.google.client-secret=test-ci \
            -Dspring.mail.host=localhost \
            -Dspring.mail.port=25 \
            -Dspring.mail.username=test \
            -Dspring.mail.password=test \
            -Dspring.mail.properties.mail.smtp.auth=false \
            -Dspring.mail.properties.mail.smtp.starttls.enable=false

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-results
          path: backend/target/surefire-reports/

      - name: Upload backend JAR
        uses: actions/upload-artifact@v6
        with:
          name: backend-jar
          path: backend/target/greencore-*.jar
          retention-days: 1

  # 3 - Frontend React + Vite
  frontend:
    name: Frontend - React + Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # 4 - Tests Selenium end-to-end
  selenium:
    name: E2E Tests - Selenium + PyTest
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download backend JAR
        uses: actions/download-artifact@v6
        with:
          name: backend-jar
          path: backend/target/

      - name: Download frontend dist
        uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q google-chrome-stable

      - name: Install Selenium deps
        run: pip install -r frontend/tests/requirements-selenium.txt

      - name: Install frontend preview deps
        working-directory: frontend
        run: npm ci

      - name: Start backend
        run: |
          java -jar backend/target/greencore-*.jar \
            --spring.profiles.active=test \
            --server.port=8080 \
            --spring.datasource.url="jdbc:h2:mem:greencore;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE" \
            --spring.datasource.driver-class-name=org.h2.Driver \
            --spring.datasource.username=sa \
            --spring.datasource.password= \
            --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            --spring.sql.init.mode=never \
            --app.jwt.secret="${{ env.JWT_SECRET_TEST }}" \
            --spring.security.oauth2.client.registration.google.client-id=test-ci \
            --spring.security.oauth2.client.registration.google.client-secret=test-ci \
            --spring.mail.host=localhost \
            --spring.mail.port=25 \
            --spring.mail.username=test \
            --spring.mail.password=test \
            --spring.mail.properties.mail.smtp.auth=false \
            --spring.mail.properties.mail.smtp.starttls.enable=false \
            > /tmp/backend.log 2>&1 &

      - name: Start frontend preview
        run: |
          cd frontend && npm run preview -- --port 5173 &

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/v3/api-docs > /dev/null 2>&1; do sleep 5; done'
          echo "Backend ready"

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/backend.log || echo "No backend log found"

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend..."
          timeout 30 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 2; done'
          echo "Frontend ready"

      - name: Run Selenium tests
        env:
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:8080
          JWT_SECRET: ${{ env.JWT_SECRET_TEST }}
        run: |
          pytest frontend/tests/ -v \
            --html=frontend/tests/selenium-report.html \
            --self-contained-html \
            -p no:warnings \
            --tb=short

      - name: Upload Selenium report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selenium-report
          path: frontend/tests/selenium-report.html

  # 5 - Trazabilidad Taiga
  taiga:
    name: Taiga Traceability Check
    runs-on: ubuntu-latest
    needs: generate
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Taiga client deps
        run: pip install -r taiga-client/requirements.txt

      - name: Run Taiga checker
        env:
          TAIGA_URL: https://api.taiga.io
          TAIGA_USERNAME: ${{ secrets.TAIGA_USERNAME }}
          TAIGA_PASSWORD: ${{ secrets.TAIGA_PASSWORD }}
          TAIGA_PROJECT: ${{ secrets.TAIGA_PROJECT }}
        run: |
          python taiga-client/taiga_checker.py --report html --ci --threshold 60

      - name: Upload Taiga report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: taiga-report
          path: taiga-report.html

  # 6 - Deploy a produccion (solo push a main)
  # Render y Netlify auto-despliegan desde GitHub; este job solo verifica salud
  deploy:
    name: Deploy to Production (Render + Netlify)
    runs-on: ubuntu-latest
    needs: [ backend, frontend, selenium, taiga ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    environment: production
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render deploy..."
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" | head -c 200
          else
            echo "RENDER_DEPLOY_HOOK not set — Render auto-deploys from GitHub push"
          fi

      - name: Trigger Netlify deploy
        run: |
          if [ -n "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "Triggering Netlify build..."
            curl -s -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}" | head -c 200
          else
            echo "NETLIFY_BUILD_HOOK not set — Netlify auto-deploys from GitHub push"
          fi

      - name: Wait for Render backend to wake up
        run: |
          echo "Waiting for Render backend (may take up to 2 min on free tier)..."
          timeout 120 bash -c \
            'until curl -sf https://greencore-api-4i99.onrender.com/actuator/health > /dev/null 2>&1; do
               echo "  still waiting..."; sleep 10;
             done'
          echo "Backend health check passed ✅"

      - name: Health check summary
        run: |
          BACKEND=$(curl -s -o /dev/null -w "%{http_code}" \
            https://greencore-api-4i99.onrender.com/actuator/health || echo "000")
          echo "Backend  → https://greencore-api-4i99.onrender.com  [HTTP $BACKEND]"
          echo "Frontend → https://greencore-frontend.onrender.com"
