# ── Database ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable data.sql so tests start with a clean DB
spring.sql.init.mode=never

# ── JWT ───────────────────────────────────────────────────────────
app.jwt.secret=test-jwt-secret-for-junit-only
app.jwt.expiration-hours=24

# ── OAuth2 (mock values; real login not exercised in tests) ───────
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret

# ── Mail (disable; tests don't send e-mail) ───────────────────────
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── Frontend URL ──────────────────────────────────────────────────
app.frontend-url=http://localhost:5173
