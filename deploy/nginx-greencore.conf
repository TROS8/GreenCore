# /etc/nginx/sites-available/greencore
# Copiar a: sudo cp nginx-greencore.conf /etc/nginx/sites-available/greencore
# Activar:  sudo ln -s /etc/nginx/sites-available/greencore /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name TU_DOMINIO_O_IP;   # ← reemplazar con dominio real o IP del servidor

    # ── Frontend React (Vite build) ──────────────────────────────────────────
    root /var/www/greencore;
    index index.html;

    # SPA fallback — todas las rutas → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Backend (Spring Boot en puerto 8080) ─────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Swagger UI ────────────────────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass         http://127.0.0.1:8080/swagger-ui/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass         http://127.0.0.1:8080/v3/api-docs;
        proxy_set_header   Host $host;
    }

    # ── Actuator health-check (sólo local) ────────────────────────────────────
    location /actuator/ {
        proxy_pass         http://127.0.0.1:8080/actuator/;
        allow              127.0.0.1;
        deny               all;
    }

    # ── OAuth2 callback ───────────────────────────────────────────────────────
    location /login/oauth2/ {
        proxy_pass         http://127.0.0.1:8080/login/oauth2/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/greencore-access.log;
    error_log  /var/log/nginx/greencore-error.log;
}
